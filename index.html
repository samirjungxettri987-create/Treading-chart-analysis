<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Chart Analyzer Pro</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>Trading Chart Analyzer Pro</h1><p>Trend • Pullback • Closed-Candle Confirmation</p></header><section class="card"><label>Language</label><select id="lang"><option value="en">English</option><option value="ne">नेपाली</option></select><input id="chart" type="file" accept="image/*"><img id="preview" hidden><button id="analyze">ANALYZE CHART</button><div id="status"></div></section><section id="result" class="card" hidden><div id="signal"></div><div class="grid" id="fields"></div><h3>Reasons</h3><ul id="reasons"></ul><h3>What to do</h3><p id="todo"></p><h3>What not to do</h3><p id="dont"></p></section><section class="card"><h2>Rules</h2><p>No forced trade. No invented levels. No setup confirmation = WAIT. This tool is decision support, not a guarantee of profit.</p></section></main><script src="app.js"></script></body></html>
